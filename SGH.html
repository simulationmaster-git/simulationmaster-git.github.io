<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standard Gain Horn Design</title>
  <meta name="description" content="Design files, application notes and other information related to the Standard Gain Horn Antennas." />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e12;
      --surface: #111720;
      --border: #1e2d3d;
      --accent: #00e5ff;
      --accent2: #ff6b35;
      --text: #c9d6e3;
      --muted: #526070;
      --mono: 'Share Tech Mono', monospace;
      --body: 'Barlow', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      font-weight: 300;
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2.5rem;
      background: rgba(10,14,18,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-decoration: none;
    }

    .nav-back {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--accent); }

    /* MAIN */
    main {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 7rem 2.5rem 5rem;
    }

    /* BREADCRUMB */
    .breadcrumb {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      margin-bottom: 2rem;
    }
    .breadcrumb a { color: var(--accent); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    /* HEADER */
    .design-tag {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: var(--mono);
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      color: #e8f0f8;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .design-summary {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 620px;
      margin-bottom: 2.5rem;
      border-left: 2px solid var(--accent);
      padding-left: 1rem;
    }

    /* SPEC TABLE */
    .spec-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 3rem;
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    .spec-table tr {
      border-bottom: 1px solid var(--border);
    }

    .spec-table td {
      padding: 0.75rem 1rem;
    }

    .spec-table td:first-child {
      color: var(--muted);
      width: 40%;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.7rem;
    }

    .spec-table td:last-child {
      color: #e8f0f8;
    }

    /* DIAGRAM */
    .diagram-box {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2.5rem;
      margin-bottom: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .diagram-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* SECTIONS */
    .section {
      margin-bottom: 3rem;
    }

    .section h2 {
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--accent2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .section p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
    }

    .section ul {
      list-style: none;
      padding: 0;
    }

    .section ul li {
      color: var(--muted);
      font-size: 0.95rem;
      padding: 0.35rem 0;
      padding-left: 1.25rem;
      position: relative;
    }

    .section ul li::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-size: 0.7rem;
      top: 0.45rem;
    }

    /* SWR CHART */
    .swr-chart {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.5rem;
      margin-top: 1.5rem;
    }

    .swr-bar-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .swr-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .swr-freq {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      width: 70px;
      flex-shrink: 0;
    }

    .swr-bar-track {
      flex: 1;
      height: 8px;
      background: var(--border);
      position: relative;
    }

    .swr-bar-fill {
      height: 100%;
      background: var(--accent);
      transition: width 1s ease;
    }

    .swr-bar-fill.warn { background: var(--accent2); }

    .swr-val {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: #e8f0f8;
      width: 40px;
      text-align: right;
      flex-shrink: 0;
    }

    /* IMAGE PLACEHOLDER */
    .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }

    .photo-slot {
      background: var(--surface);
      border: 1px dashed var(--border);
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* BACK BUTTON */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.1em;
      margin-top: 2rem;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--accent); }

    /* FOOTER */
    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      padding: 2rem 2.5rem;
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      nav { padding: 1rem 1.25rem; }
      main { padding: 6rem 1.25rem 3rem; }
      .photo-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">// ANTENNA LAB</a>
  <a class="nav-back" href="index.html">◂ Back to designs</a>
</nav>

<main>

  <p class="breadcrumb"><a href="index.html">Designs</a> &nbsp;/&nbsp; Standard Gain Horn</p>

  <p class="design-tag">▸ SGH </p>
  <h1>Standard Gain Horn<br>Various Frequencies</h1>
  <p class="design-summary">In this page you can find all the information how to design a SGH antenna from scratch and links to the predesigned antennas.</p>

  </table> -->

  <a class="back-btn" href="index.html">◂ Back to all designs</a>

</main>

<footer>
  <span>// ANTENNA LAB</span>
  <span>Half-Wave Dipole — 40m</span>
</footer>

</body>
</html>
